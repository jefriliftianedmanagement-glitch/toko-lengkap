<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#5b5bf0" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/pwa.css" />
  <meta name="robots" content="noindex" />
  <title>Riwayat Transaksi - Admin FakeShop</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <script src="/js/app.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/transactions.js" defer></script>
  <script src="/js/pwa.js" defer></script>
</head>
<body>
  <main data-title="Riwayat Transaksi">
    <section class="tx-intro">
      <div>
        <h2>Seluruh transaksi</h2>
        <p>Pantau pergerakan saldo virtual dari klaim top-up, pengiriman saldo admin, dan pembelian yang tercatat.</p>
      </div>
      <button class="btn btn-ghost" id="refreshTransactions" type="button">Muat ulang</button>
    </section>

    <div class="admin-toolbar tx-toolbar">
      <div class="grow">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <label class="sr-only" for="txSearch">Cari transaksi, username, atau ID akun</label>
        <input id="txSearch" type="search" placeholder="Cari kode transaksi, username, atau ID akun…" maxlength="50" autocomplete="off" />
      </div>
      <div class="segmented" id="txTypeFilters" role="group" aria-label="Filter jenis transaksi">
        <button type="button" data-type="all" aria-pressed="true">Semua</button>
        <button type="button" data-type="TOPUP_CLAIM" aria-pressed="false">Top-up</button>
        <button type="button" data-type="ADMIN_SEND_BALANCE" aria-pressed="false">Kirim saldo</button>
        <button type="button" data-type="PURCHASE" aria-pressed="false">Pembelian</button>
      </div>
    </div>

    <div class="tx-filter-row">
      <div class="segmented" id="txStatusFilters" role="group" aria-label="Filter status transaksi">
        <button type="button" data-status="all" aria-pressed="true">Semua status</button>
        <button type="button" data-status="SUCCESS" aria-pressed="false">Berhasil</button>
        <button type="button" data-status="FAILED" aria-pressed="false">Gagal</button>
      </div>
      <div class="tx-dates">
        <label>Dari <input id="txFrom" type="date" /></label>
        <label>Sampai <input id="txTo" type="date" /></label>
        <button class="btn btn-ghost btn-sm" id="clearTxDates" type="button">Reset tanggal</button>
      </div>
    </div>

    <section class="panel tx-panel" aria-label="Daftar transaksi">
      <div class="tx-summary" id="txSummary" aria-live="polite">Memuat transaksi…</div>
      <div id="txList" aria-live="polite" aria-busy="true">
        <div class="tx-loading"><span class="spinner"></span><span>Memuat transaksi…</span></div>
      </div>
      <div class="pager" id="txPager"></div>
    </section>
  </main>
</body>
</html>
