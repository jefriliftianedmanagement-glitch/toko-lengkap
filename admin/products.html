<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#5b5bf0" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/pwa.css" />
  <meta name="robots" content="noindex" />
  <title>Produk - Admin FakeShop</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <script src="/js/app.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/products.js" defer></script>
  <script src="/js/pwa.js" defer></script>
</head>
<body>
  <main data-title="Manajemen Produk">
    <div class="admin-toolbar">
      <div class="grow">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <label class="sr-only" for="q">Cari produk</label>
        <input id="q" type="search" placeholder="Cari nama produk…" maxlength="100" autocomplete="off" />
      </div>
      <div class="segmented" id="statusGroup" role="group" aria-label="Filter status">
        <button type="button" data-status="all" aria-pressed="true">Semua</button>
        <button type="button" data-status="active" aria-pressed="false">Aktif</button>
        <button type="button" data-status="inactive" aria-pressed="false">Nonaktif</button>
      </div>
      <button class="btn btn-primary" id="addBtn" type="button">+ Tambah produk</button>
    </div>
    <section class="panel">
      <div class="plist" id="plist"></div>
      <div class="pager" id="pager"></div>
    </section>
  </main>
</body>
</html>
