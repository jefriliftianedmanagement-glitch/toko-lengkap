<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#5b5bf0" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/pwa.css" />
  <meta name="robots" content="noindex" />
  <title>Inbox Top-up - Admin FakeShop</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <script src="/js/app.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/inbox.js" defer></script>
  <script src="/js/pwa.js" defer></script>
</head>
<body>
  <main data-title="Inbox Top-up">
    <div class="inbox-intro">
      <div><h2>Permintaan top-up</h2><p>Tinjau permintaan saldo virtual dari pengguna. Saldo baru dapat diklaim setelah persetujuan admin.</p></div>
      <button class="btn btn-ghost" id="refreshBtn" type="button">Muat ulang</button>
    </div>

    <div class="admin-toolbar inbox-toolbar">
      <div class="grow">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <label class="sr-only" for="q">Cari username atau ID akun</label>
        <input id="q" type="search" placeholder="Cari username atau ID akun…" maxlength="50" autocomplete="off" />
      </div>
      <div class="segmented" id="statusGroup" role="group" aria-label="Filter status permintaan">
        <button type="button" data-status="PENDING" aria-pressed="true">Menunggu</button>
        <button type="button" data-status="all" aria-pressed="false">Semua</button>
        <button type="button" data-status="APPROVED" aria-pressed="false">Disetujui</button>
        <button type="button" data-status="REJECTED" aria-pressed="false">Ditolak</button>
      </div>
    </div>

    <section class="panel inbox-panel" aria-label="Daftar permintaan top-up">
      <div class="inbox-summary" id="inboxSummary" aria-live="polite">Memuat permintaan…</div>
      <div id="inboxList"></div>
      <div class="pager" id="pager"></div>
    </section>
  </main>
</body>
</html>
