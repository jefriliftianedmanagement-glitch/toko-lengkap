<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#5b5bf0" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/pwa.css" />
  <meta name="robots" content="noindex" />
  <title>Login Admin - FakeShop</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="/js/app.js"></script>
  <script src="js/login.js" defer></script>
  <script src="/js/pwa.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-top">
      <span class="logo"><span class="logo-mark" data-icon="shield" data-size="20"></span><span>FakeShop Admin</span></span>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Ganti tema"></button>
    </div>
    <h1>Masuk sebagai admin</h1>
    <p class="sub">Halaman ini khusus administrator toko.</p>
    <div class="form-error" id="formError" role="alert" hidden></div>
    <form id="authForm" novalidate>
      <div class="field">
        <label for="username">Username admin</label>
        <input class="input" id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="30" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input class="input has-toggle" id="password" name="password" type="password" autocomplete="current-password" maxlength="72" required />
          <button class="pw-toggle" type="button" aria-label="Tampilkan password"></button>
        </div>
      </div>
      <button class="btn btn-primary btn-block" id="submitBtn" type="submit">Masuk</button>
    </form>
  </main>
</body>
</html>
