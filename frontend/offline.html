<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#5b5bf0" />
  <meta name="robots" content="noindex" />
  <title>Offline - FakeShop</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" sizes="192x192" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/pwa.css" />
</head>
<body class="offline-page">
  <main class="offline-card">
    <div class="offline-mark" aria-hidden="true">🛍️</div>
    <p class="offline-eyebrow">FAKESHOP</p>
    <h1>Anda sedang offline</h1>
    <p>Koneksi internet sedang tidak tersedia. Halaman dan data akun akan dimuat kembali saat koneksi pulih.</p>
    <button class="btn btn-primary" type="button" onclick="location.reload()">Coba lagi</button>
    <p class="offline-note">Demi keamanan, saldo, transaksi, dan data akun tidak disimpan untuk akses offline.</p>
  </main>
</body>
</html>
