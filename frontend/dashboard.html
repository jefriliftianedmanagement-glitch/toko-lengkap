<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#5b5bf0" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/pwa.css" />
  <title>Toko - online</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/app.js"></script>
  <script src="js/dashboard.js" defer></script>
  <script src="/js/pwa.js" defer></script>
</head>
<body data-page="dashboard">
  <main class="container">
    <div class="page-head">
      <h1 class="page-title">Temukan produk</h1>
      <p class="page-sub">Belanja dengan saldo virtual. Tidak ada uang sungguhan yang dipakai.</p>
    </div>

    <div class="chips" id="categoryChips" aria-label="Filter kategori"></div>

    <div class="toolbar">
      <div class="result-info" id="resultInfo" aria-live="polite"></div>
      <div class="segmented" id="sortGroup" role="group" aria-label="Urutkan produk">
        <button type="button" data-sort="newest" aria-pressed="true">Terbaru</button>
        <button type="button" data-sort="popular" aria-pressed="false">Terpopuler</button>
        <button type="button" data-sort="cheapest" aria-pressed="false">Termurah</button>
        <button type="button" data-sort="expensive" aria-pressed="false">Tertinggi</button>
      </div>
    </div>

    <div class="grid" id="grid"></div>
    <div id="stateBox"></div>
    <div id="sentinel" aria-hidden="true"></div>
    <div class="load-more" id="loadMoreWrap" hidden>
      <button class="btn btn-ghost" id="loadMore" type="button">Muat lebih banyak</button>
    </div>
  </main>
</body>
</html>
